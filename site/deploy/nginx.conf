# PacedMind on one domain, all static: the home page (site/out) in /srv/pacedmind/site and the
# docs (docs/out) in /srv/pacedmind/docs, served at /docs (deploy/README.md). The VPS runs Caddy
# (deploy/Caddyfile); these are the same rules for Nginx, should that change. The web app at
# app.pacedmind.com would need a server block of its own (proxy_pass http://127.0.0.1:3000).
# Install as /etc/nginx/sites-available/pacedmind.conf (linked from sites-enabled). The HTTPS servers
# need the certificate first (deploy/README.md), then: nginx -t && systemctl reload nginx

# Content-hashed build files are cached for good, images for a day; pages and text files are checked
# again on every visit (the ETag keeps that cheap). Keyed on the address as requested, so Nginx's
# internal redirects don't change the answer.
map $request_uri $pacedmind_cache {
    ~^/(docs/)?_next/static/                            "public, max-age=31536000, immutable";
    ~\.(png|jpe?g|webp|avif|gif|svg|ico|woff2?)(\?|$)  "public, max-age=86400";
    default                                             "no-cache";
}

# Readable, but kept out of search results: the files Next.js fetches for client-side navigation
# (every .txt except robots.txt and llms.txt), the docs as Markdown for assistants, and the docs'
# search index. An empty value sends no header.
map $request_uri $pacedmind_robots {
    ~^/(docs/)?(robots|llms|llms-full)\.txt(\?|$)  "";
    ~\.(txt|mdx)(\?|$)                             "noindex";
    ~^/docs/llms\.mdx/                             "noindex";
    ~^/docs/api/search(\?|$)                       "noindex";
    default                                        "";
}

# Unknown addresses get a 404 page: the docs' own under /docs, the site's everywhere else.
map $request_uri $pacedmind_404 {
    ~^/docs(/|\?|$)  /docs/404.html;
    default          /404.html;
}

# http:// and www go to the one canonical origin.
server {
    listen 80;
    listen [::]:80;
    server_name pacedmind.com www.pacedmind.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://pacedmind.com$request_uri;
    }
}

# Nginx before 1.25.1: remove "http2 on;" and write "listen 443 ssl http2;" instead.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pacedmind.com;

    ssl_certificate     /etc/letsencrypt/live/pacedmind.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pacedmind.com/privkey.pem;

    return 301 https://pacedmind.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pacedmind.com;

    ssl_certificate     /etc/letsencrypt/live/pacedmind.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pacedmind.com/privkey.pem;

    root /srv/pacedmind/site;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/xml text/markdown application/xml application/javascript application/json application/manifest+json image/svg+xml image/x-icon;
    # Serves the .gz files made at deploy (deploy/README.md). With the ngx_brotli module (Debian and
    # Ubuntu: libnginx-mod-http-brotli-static), also turn on brotli_static for the .br files.
    gzip_static on;
    # brotli_static on;

    # Every response gets these, and the maps above vary them by address. So no location below has an
    # add_header of its own, which would drop all of these for that location.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $pacedmind_cache;
    add_header X-Robots-Tag $pacedmind_robots;

    # One URL per page, in both apps: no index.html, no .html and no trailing slash. The home page is
    # "/", and the docs' home page is "/docs". $request_uri is the address as requested, so after an
    # internal redirect (a 404 page, say) these still see the original and don't fire again.
    if ($request_uri ~ "^/index(\.html)?(\?.*)?$") {
        return 301 /$2;
    }
    if ($request_uri ~ "^(/[^?]*)/index(\.html)?(\?.*)?$") {
        return 301 $1$3;
    }
    if ($request_uri ~ "^(/[^?]*)\.html(\?.*)?$") {
        return 301 $1$2;
    }
    if ($request_uri ~ "^(/[^?]*[^/?])/+(\?.*)?$") {
        return 301 $1$2;
    }

    error_page 404 $pacedmind_404;

    # The 404 pages and Next's own not-found routes aren't pages of their own: answer 404, never 200.
    location = /404 {
        return 404;
    }
    location = /_not-found {
        return 404;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # The home page and everything else.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The docs. A section has both views.html and a views/ folder; /docs is docs/index.html.
    location = /docs {
        root /srv/pacedmind;
        try_files $uri.html $uri/index.html =404;
    }
    location ^~ /docs/ {
        root /srv/pacedmind;
        try_files $uri $uri.html $uri/index.html =404;

        location = /docs/404 {
            return 404;
        }
        location = /docs/_not-found {
            return 404;
        }
        # The docs as Markdown for assistants; Nginx's mime.types has no .md.
        location /docs/llms.mdx/ {
            types { }
            default_type "text/markdown; charset=utf-8";
        }
        # /docs/<page>.mdx is the same, as on Fumadocs sites with a server.
        location ~ ^/docs/(.+)\.mdx$ {
            types { }
            default_type "text/markdown; charset=utf-8";
            try_files /docs/llms.mdx/$1/content.md =404;
        }
        # The docs' search index is a JSON file without an extension.
        location = /docs/api/search {
            default_type application/json;
        }
    }
}
